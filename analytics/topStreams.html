<!DOCTYPE html>
<html lang="es">
<head>
    <title>Her0Pass Twitch</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="apple-touch-icon" href="../assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="../assets/img/favicon.ico">

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/templatemo.css">
    <link rel="stylesheet" href="../assets/css/custom.css">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="../assets/css/fontawesome.min.css">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light shadow">
        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand text-success logo h1 align-self-center" href="../index.html">
                Her0Pass Twitch
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#templatemo_main_nav" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="align-self-center collapse navbar-collapse flex-fill  d-lg-flex justify-content-lg-between" id="templatemo_main_nav">
                <div class="flex-fill">
                    <ul class="nav navbar-nav d-flex justify-content-between mx-lg-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../pedirStreamer.html">Caso1</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="streams.html">Caso2</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="topStreams.html">Caso3</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </nav>
    <!-- Close Header -->

    <div class="container mt-5">
        <h1 class="text-center">10 Streams Españoles con más Espectadores</h1>
        <div class="text-center mb-4">
            <input type="number" id="limit" class="form-control d-inline-block w-auto" placeholder="Número de streams" min="1" max ="10" value="10">
            <button class="btn btn-primary" onclick="fetchStreams('asc')">Ordenar Ascendente</button>
            <button class="btn btn-primary" onclick="fetchStreams('desc')">Ordenar Descendente</button>
        </div>
        <div id="streams" class="row"></div>
    </div>
    
    <script>
        async function fetchStreams(order = 'asc') {
            const limit = document.getElementById('limit').value || 10; // Obtener el valor del límite del input
            try {
                // Solicitar los datos al servidor PHP
                const response = await fetch(`http://www.her0pass.wuaze.com/analytics/topStreams.php?order=${order}&limit=${limit}`);
                
                // Verificar si la respuesta es exitosa (status 200)
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
    
                // Convertir la respuesta en formato JSON
                const data = await response.json();
    
                // Verificar si hay un error en los datos (como 'error' en el JSON)
                if (data.error) {
                    document.getElementById("streams").innerHTML = `<p class='text-danger'>${data.error}</p>`;
                    return;
                }
    
                // Generar el HTML con los streams
                let html = "";
                data.forEach(stream => {
                    html += `
                        <div class="col-md-4">
                            <div class="card mb-4">
                                <div class="card-body">
                                    <p class="card-text"><strong>Streamer:</strong> ${stream.nombre}</p>
                                    <p class="card-text"><strong>Título:</strong> ${stream.title}</p>
                                    <p class="card-text"><strong>Espectadores:</strong> ${stream.espectadores}</p>
                                </div>
                            </div>
                            <hr>
                        </div>`;
                });
    
                // Insertar el contenido generado en el div de streams
                document.getElementById("streams").innerHTML = html;
                
            } catch (error) {
                // Si ocurre algún error, lo mostramos en la página
                document.getElementById("streams").innerHTML = `<p class='text-danger'>Error al cargar los streams. ${error.message}</p>`;
            }
        }
    
        // Llamada a la función para obtener los datos cuando se carga la página
        fetchStreams();
    </script>

    <!-- Bootstrap JS -->
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <!-- Templatemo JS -->
    <script src="../assets/js/templatemo.js"></script>
    <!-- Custom JS -->
    <script src="../assets/js/custom.js"></script>
</body>
</html>
