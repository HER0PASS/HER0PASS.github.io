<!--
    

-->

    <script>
        function buscarStreamer(event) {
            event.preventDefault(); // Evitar recarga de la página
            
            let streamerName = document.getElementById("streamer").value;

            fetch("pedirStreamer.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "streamer=" + encodeURIComponent(streamerName)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert("Error: " + data.error);
                } else {
                    // Convertir los datos a una URL con parámetros y redirigir
                    let params = new URLSearchParams(data).toString();
                    window.location.href = "/analytics/streamer.html?" + params;
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</head>

<body>

   <!-- Start Content -->
    <div class="container-fluid bg-light py-5">
        <div class="col-md-6 m-auto text-center">
            <h1 class="h1">Nombre del Streamer</h1>
            <!--formulario que pide el nombre del streamer-->
            <form onsubmit="buscarStreamer(event)">
