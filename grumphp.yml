# grumphp.yml
grumphp:
    tasks:
        git_commit_message:
            allow_empty_message: false
            enforce_capitalized_subject: false
            case_insensitive: false
            max_subject_width: 100
            matchers:
                Must follow commit format: /\[#\d+\] - .+/

        phpmd:
            whitelist_patterns: []
            exclude: []
            report_format: text
            ruleset: ['cleancode', 'codesize', 'naming']
            triggered_by: ['php']

        phpcs:
            standard: PSR12
            severity: ~
            error_severity: ~
            warning_severity: ~
            tab_width: ~
            report: full
            report_width: ~
            whitelist_patterns: []
            encoding: ~
            ignore_patterns: []
            sniffs: []
            triggered_by: [php]
            exclude: []
            show_sniffs_error_path: true
            parallel: null

        phpcsfixer:
            config: .php-cs-fixer.php
            allow_risky: false
            verbose: true
            diff: true
            triggered_by: [ 'php' ]



