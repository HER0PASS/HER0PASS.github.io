<!DOCTYPE html>
<html lang="es">

<head>
    <title>Consultar streamer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="apple-touch-icon" href="../assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="../assets/img/favicon.ico">

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/templatemo.css">
    <link rel="stylesheet" href="../assets/css/custom.css">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="../assets/css/fontawesome.min.css">
</head>

<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light shadow">
        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand text-success logo h1 align-self-center" href="../index.html">
                Her0Pass Twitch
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#templatemo_main_nav" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="align-self-center collapse navbar-collapse flex-fill  d-lg-flex justify-content-lg-between" id="templatemo_main_nav">
                <div class="flex-fill">
                    <ul class="nav navbar-nav d-flex justify-content-between mx-lg-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./streamer.html">Caso1</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./streams.html">Caso2</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./topStreams.html">Caso3</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </nav>
    <!-- Close Header -->

    <div class="container mt-5">
        <h1 class="text-center">Consulta de Streamers en Twitch</h1>
        <div class="form-group">
            <label for="streamer_id">ID del Streamer:</label>
            <input type="text" id="streamer_id" class="form-control" placeholder="Introduce el ID del streamer">
        </div>
        <button class="btn btn-primary mt-2" onclick="fetchStreamer()">Buscar</button>
        <div id="streamer_info" class="mt-4"></div>
    </div>
    <script>
        async function fetchStreamer() {
            const streamerId = document.getElementById("streamer_id").value.trim();
            if (!streamerId) {
                document.getElementById("streamer_info").innerHTML = `<p class='text-danger'>Por favor, introduce un ID de usuario válido.</p>`;
                return;
            }
            try {
                const response = await fetch(`streamer.php?id=${streamerId}`);
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                const data = await response.json();
                if (data.error) {
                    document.getElementById("streamer_info").innerHTML = `<p class='text-danger'>${data.error}</p>`;
                    return;
                }
                // Mostrar información del streamer
                document.getElementById("streamer_info").innerHTML = `
                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title">${data.display_name} (${data.login})</h3>
                            <img src="${data.profile_image_url}" class="img-fluid rounded-circle mb-3" width="100">
                            <p><strong>ID:</strong> ${data.id}</p>
                            <p><strong>Tipo:</strong> ${data.broadcaster_type || "No especificado"}</p>
                            <p><strong>Descripción:</strong> ${data.description || "Sin descripción"}</p>
                            <p><strong>View_count (obsoleto):</strong> ${data.view_count}</p>
                            <p><strong>Creado en:</strong> ${new Date(data.created_at).toLocaleDateString()}</p>
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById("streamer_info").innerHTML = `<p class='text-danger'>Error al cargar la información. ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
